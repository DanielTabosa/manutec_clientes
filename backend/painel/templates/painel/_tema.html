<div class="tema{% if solta %} tema-solta{% endif %}" role="group" aria-label="Tema da tela" data-tema>
  <button type="button" data-valor="light" aria-pressed="false" title="Modo claro" aria-label="Modo claro"><svg class="i"><use href="#i-sol"/></svg></button>
  <button type="button" data-valor="auto" aria-pressed="false" title="Seguir o sistema" aria-label="Seguir o sistema"><svg class="i"><use href="#i-auto"/></svg></button>
  <button type="button" data-valor="dark" aria-pressed="false" title="Modo escuro" aria-label="Modo escuro"><svg class="i"><use href="#i-lua"/></svg></button>
</div>
